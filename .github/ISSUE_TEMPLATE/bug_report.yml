name: Bug report
description: Report a reproducible issue without private research data
title: "[Bug]: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: 实际行为与预期行为
      description: 请使用虚构数据，不粘贴令牌、审稿意见或私人数据库。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统、应用版本、运行方式（Web / Tauri）
    validations:
      required: true
