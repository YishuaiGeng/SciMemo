services:
  sync:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - server/.env
    volumes:
      - scimemo-sync:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  scimemo-sync:
